# Temporary preview-branch-only workflow to regenerate a verified npm lockfile.
# Delete this workflow after the audited lockfile is committed.
name: Preview dependency lock refresh
on:
  push:
    branches:
      - preview/caribbean-positioning-20261029
    paths:
      - package.json
      - .github/workflows/preview-dependency-lock-refresh.yml
permissions:
  contents: read
jobs:
  update-preview-lockfile:
    if: github.repository == 'MrFixITslu/v79website' && github.ref == 'refs/heads/preview/caribbean-positioning-20261029'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: preview/caribbean-positioning-20261029
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Regenerate dependency lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify production dependencies against published advisories
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit preview-only lockfile update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current'
            exit 0
          fi
          git config user.name 'v79-security-lock-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh patched npm dependency lockfile for preview security checks'
          git push origin HEAD:preview/caribbean-positioning-20261029
