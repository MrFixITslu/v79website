name: Continuous Delivery

on:
  workflow_run:
    workflows: ["Production checks"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deliver:
    name: Package and publish
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    timeout-minutes: 20

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Create release bundle
        shell: bash
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.env --exclude='.env.*' \
              --exclude=data --exclude=uploads --exclude=backups --exclude=dist --exclude='*.tar.gz' \
              -czf "${RUNNER_TEMP}/${GITHUB_REPOSITORY##*/}-${GITHUB_SHA::12}.tar.gz" .

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/*.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Detect Dockerfile
        id: docker
        shell: bash
        run: |
          if [ -f Dockerfile ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: ${{ steps.docker.outputs.enabled == 'true' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish validated Docker image
        if: ${{ steps.docker.outputs.enabled == 'true' }}
        shell: bash
        run: |
          IMAGE="${{ steps.docker.outputs.image }}"
          COMMIT="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA="${COMMIT::12}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHORT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"

  deploy:
    name: Deploy validated release to server
    runs-on: ubuntu-latest
    needs: deliver
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/release

      - name: Join deployment tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Configure deployment transport
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          install -d -m 700 "$HOME/.ssh"

          ssh_ready=false
          if [ -n "${DEPLOY_SSH_KEY:-}" ] && [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/deploy-key.raw"
            if grep -Fq '\\n' "$RUNNER_TEMP/deploy-key.raw"; then
              printf '%b\n' "$(cat "$RUNNER_TEMP/deploy-key.raw")" > "$HOME/.ssh/id_ed25519"
            else
              cat "$RUNNER_TEMP/deploy-key.raw" > "$HOME/.ssh/id_ed25519"
              printf '\n' >> "$HOME/.ssh/id_ed25519"
            fi

            if ! grep -q '^-----BEGIN .*PRIVATE KEY-----$' "$HOME/.ssh/id_ed25519"; then
              if base64 -d "$HOME/.ssh/id_ed25519" > "$RUNNER_TEMP/deploy-key.decoded" 2>/dev/null \
                 && grep -q '^-----BEGIN .*PRIVATE KEY-----$' "$RUNNER_TEMP/deploy-key.decoded"; then
                mv "$RUNNER_TEMP/deploy-key.decoded" "$HOME/.ssh/id_ed25519"
                printf '\n' >> "$HOME/.ssh/id_ed25519"
              fi
            fi

            printf '%s' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/known-hosts.raw"
            if grep -Fq '\\n' "$RUNNER_TEMP/known-hosts.raw"; then
              printf '%b\n' "$(cat "$RUNNER_TEMP/known-hosts.raw")" > "$HOME/.ssh/known_hosts"
            else
              cat "$RUNNER_TEMP/known-hosts.raw" > "$HOME/.ssh/known_hosts"
              printf '\n' >> "$HOME/.ssh/known_hosts"
            fi
            chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

            if ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null 2>&1; then
              ssh_ready=true
            fi
          fi

          if [ "$ssh_ready" = true ]; then
            echo "DEPLOY_TRANSPORT=ssh" >> "$GITHUB_ENV"
            echo "Using pinned OpenSSH deployment transport."
            exit 0
          fi

          echo "Stored DEPLOY_SSH_KEY is unusable; testing Tailscale SSH fallback."
          if timeout 20s tailscale ssh "${DEPLOY_USER}@${DEPLOY_HOST}" true; then
            echo "DEPLOY_TRANSPORT=tailscale" >> "$GITHUB_ENV"
            echo "Using Tailscale SSH deployment transport."
            exit 0
          fi

          echo "No usable deployment transport is available." >&2
          echo "Either replace DEPLOY_SSH_KEY with the complete unencrypted private key, or enable/allow Tailscale SSH for the deployment identity." >&2
          exit 1

      - name: Transfer and deploy release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
        run: |
          set -euo pipefail
          for name in RELEASE_SHA DEPLOY_HOST DEPLOY_USER DEPLOY_ROOT DEPLOY_PROJECT DEPLOY_TRANSPORT; do
            test -n "${!name}" || { echo "Missing production setting: $name" >&2; exit 1; }
          done
          archive="$(find "$RUNNER_TEMP/release" -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          test -n "$archive"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_archive="v79-release-${RELEASE_SHA}.tar.gz"

          if [ "$DEPLOY_TRANSPORT" = "tailscale" ]; then
            cat "$archive" | tailscale ssh "$target" "cat > $remote_archive"
            printf -v remote_cmd 'bash -s -- %q %q %q %q' "$RELEASE_SHA" "$DEPLOY_ROOT" "$DEPLOY_PROJECT" "V79website"
            tailscale ssh "$target" "$remote_cmd" < scripts/deploy-server.sh
          else
            port="${DEPLOY_SSH_PORT:-22}"
            [[ "$port" =~ ^[0-9]+$ ]] || exit 1
            scp -P "$port" -o StrictHostKeyChecking=yes "$archive" "$target:$remote_archive"
            ssh -p "$port" -o StrictHostKeyChecking=yes "$target" bash -s -- "$RELEASE_SHA" "$DEPLOY_ROOT" "$DEPLOY_PROJECT" "V79website" < scripts/deploy-server.sh
          fi
