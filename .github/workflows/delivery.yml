name: Production deployment — safety lock

# Production site is running the image-only release from commit
# 2133eadc4bbc30a7f1136221748dd7d5c01d9224.
# Do not trigger on CI completion, push, PR, or schedule.
# A real production release must use an independently reviewed, guarded
# image-only cutover with pinned image identity, validated backups,
# isolated smoke tests, unchanged mounts/env/networks, and rollback.
# The previous workflow_run -> scripts/deploy-server.sh path is retired.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-locked:
    name: Deployment locked — no production actions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain release hold
        shell: bash
        run: |
          echo "::notice title=Production safety lock::Website deployment from GitHub Actions is disabled."
          echo "No Docker image is published and no live server is contacted."
          echo "Use a separately reviewed guarded release procedure and explicit owner approval."
